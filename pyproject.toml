[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-carrying-ci"
version = "0.1.0"
description = "The verification portfolio as one CI check — the aggregate is the weakest leg, never the mean"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nick Harris" }]
keywords = ["ci", "github-actions", "verification", "sarif", "audit", "attestation", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
all = ["evidence", "gridlock", "signoff-cert", "honestbench", "proof-to-code-drift", "sf-verify"]
dev = ["pytest>=7", "evidence", "gridlock"]

[project.scripts]
proof-carrying-ci = "proof_carrying_ci.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/proof-carrying-ci"
Source = "https://github.com/nickharris808/proof-carrying-ci"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
