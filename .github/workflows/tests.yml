name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "gridlock @ git+https://github.com/nickharris808/gridlock" "evidence @ git+https://github.com/nickharris808/evidence"
      - name: Test
        run: python -m pytest -q
      - name: The aggregation rule
        run: proof-carrying-ci selftest
